<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Efecto rombos con CSS</title>
  <style>
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      position: relative;
      width: 700px;
      height: 300px;
      overflow: hidden;
      border-radius: 12px;
    }

    .container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Capa superpuesta con rombos */
    .container::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        repeating-linear-gradient(45deg, rgba(255,255,255,0.5) 0, rgba(255,255,255,0.2) 4px, transparent 4px, transparent 40px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,0.5) 0, rgba(255,255,255,0.2) 4px, transparent 4px, transparent 40px);
      mix-blend-mode: multiply; /* Cambia a overlay/soft-light según el look que quieras */
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://picsum.photos/600/400" alt="Imagen con efecto">
  </div>
</body>
</html>
